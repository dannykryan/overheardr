<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>{{ title }}</h1>
    <p>Paste a YouTube URL to extract albums and build a Spotify playlist.</p>
    {% if spotify_connected %}
    <p class="note spotify-ok">Spotify connected{% if spotify_display_name %} as {{ spotify_display_name }}{% endif %}.</p>
    {% else %}
    <p class="note">Spotify is not connected yet. You will log in before creating a playlist.</p>
    {% endif %}
    <form action="/" method="post">
      <label for="url">YouTube URL</label>
      <input type="url" id="url" name="url" required placeholder="https://www.youtube.com/watch?v=…">
      <button type="submit">Analyze video</button>
    </form>
  </main>
</body>
</html>
